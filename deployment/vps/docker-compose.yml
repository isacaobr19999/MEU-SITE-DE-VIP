services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [playstorcraft]

  app:
    build:
      context: ../..
      dockerfile: deployment/vps/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SELF_HOSTED: "true"
      PORT: 3000
      VITE_APP_ID: playstorcraft
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      MINECRAFT_API_KEY_PEPPER: ${MINECRAFT_API_KEY_PEPPER}
      DISCORD_BOT_BRIDGE_SECRET: ${DISCORD_BOT_BRIDGE_SECRET:-}
      MAINTENANCE_SECRET: ${MAINTENANCE_SECRET}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN}
      MERCADO_PAGO_PUBLIC_KEY: ${MERCADO_PAGO_PUBLIC_KEY}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET}
    depends_on:
      mysql:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    networks: [playstorcraft]

  discord-bot:
    build:
      context: ../..
      dockerfile: deployment/vps/discord-bot.Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_BOT_BRIDGE_SECRET: ${DISCORD_BOT_BRIDGE_SECRET:-}
      DISCORD_ENABLE_PRESENCE: ${DISCORD_ENABLE_PRESENCE:-true}
      DISCORD_INVITE_URL: ${DISCORD_INVITE_URL:-}
      DISCORD_INVITE_CHANNEL_ID: ${DISCORD_INVITE_CHANNEL_ID:-}
      DISCORD_STATUS_CHANNEL_ID: ${DISCORD_STATUS_CHANNEL_ID:-}
      DISCORD_OPERATIONS_CHANNEL_ID: ${DISCORD_OPERATIONS_CHANNEL_ID:-}
      DISCORD_TICKET_TRANSCRIPTS_CHANNEL_ID: ${DISCORD_TICKET_TRANSCRIPTS_CHANNEL_ID:-}
      DISCORD_MANAGED_INVITE: ${DISCORD_MANAGED_INVITE:-false}
      DISCORD_STATUS_INTERVAL_MS: ${DISCORD_STATUS_INTERVAL_MS:-90000}
      PLAYSTORCRAFT_PUBLIC_STATUS_URL: ${PLAYSTORCRAFT_PUBLIC_STATUS_URL:-http://app:3000/api/trpc/community.status?input=%7B%22json%22%3Anull%7D}
      PLAYSTORCRAFT_BRIDGE_URL: http://app:3000/api/integrations/discord/status
      PLAYSTORCRAFT_OPERATIONS_BRIDGE_URL: http://app:3000/api/integrations/discord/operations
      PLAYSTORCRAFT_TICKET_TRANSCRIPTS_BRIDGE_URL: http://app:3000/api/integrations/discord/ticket-transcripts
    depends_on:
      app:
        condition: service_started
    networks: [playstorcraft]
    volumes:
      - discord_bot_data:/bot/data

  monitoring-agent:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    environment:
      MAINTENANCE_SECRET: ${MAINTENANCE_SECRET}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-300}
      PLAYSTORCRAFT_APP_URL: http://app:3000
    command: ["/bin/sh", "/opt/monitor/monitor.sh"]
    depends_on:
      app:
        condition: service_started
    networks: [playstorcraft]
    volumes:
      - ./monitor.sh:/opt/monitor/monitor.sh:ro

  maintenance-scheduler:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    environment:
      MAINTENANCE_SECRET: ${MAINTENANCE_SECRET}
    command: ["/bin/sh", "-c", "while true; do curl --fail --silent --show-error --max-time 20 -X POST http://app:3000/api/scheduled/store-maintenance -H \"x-maintenance-secret: $$MAINTENANCE_SECRET\" || true; sleep 60; done"]
    depends_on:
      app:
        condition: service_started
    networks: [playstorcraft]

networks:
  playstorcraft:

volumes:
  mysql_data:
  discord_bot_data:
