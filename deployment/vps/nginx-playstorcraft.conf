server {
  listen 80;
  listen [::]:80;
  server_name playstorcraft.com.br www.playstorcraft.com.br;

  client_max_body_size 10m;

  server_tokens off;

  # A configuração HTTPS ativa acrescenta HSTS após o Certbot emitir o certificado.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;

  location ^~ /store-assets/ {
    alias /srv/playstorcraft-assets/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, max-age=0" always;
  }
}
