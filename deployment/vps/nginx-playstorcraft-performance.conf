# Este arquivo é incluído dentro do bloco HTTPS do servidor PlayStorCraft.
# Não contém listen, server_name ou certificados para não conflitar com o Certbot.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

# Bundles do Vite recebem hash de conteúdo: são seguros para cache de longo prazo.
location ^~ /assets/ {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_hide_header Cache-Control;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}
